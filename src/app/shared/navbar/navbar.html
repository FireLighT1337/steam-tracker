<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <div class="navbar-left">
      @if (isGameDetailsPage()) {
        <button type="button" class="navbar-back-link" (click)="goBack()">
          <i class="bi bi-arrow-left"></i>
          Back
        </button>
      }

      <a class="navbar-brand" routerLink="/">
        <span class="brand-icon">
          <i class="bi bi-controller"></i>
        </span>
        SteamTracker
      </a>
    </div>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="navbar" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
            <i class="bi bi-grid me-1"></i>
            Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a routerLink="/library" routerLinkActive="active" class="nav-link">
            <i class="bi bi-controller me-1"></i>
            Library
          </a>
        </li>

        <li class="nav-item">
          <a routerLink="/backlog" routerLinkActive="active" class="nav-link">
            <i class="bi bi-bookmark me-1"></i>
            Backlog
          </a>
        </li>

        <li class="nav-item">
          <a routerLink="/completed" routerLinkActive="active" class="nav-link">
            <i class="bi bi-check-circle me-1"></i>
            Completed
          </a>
        </li>

        <li class="nav-item">
          @if (isLoggedIn()) {
            <button class="nav-link auth-btn" (click)="logout()">
              <i class="bi bi-box-arrow-right me-1"></i>
              Logout
            </button>
          } @else {
            <button class="auth-btn steam-login-btn" (click)="login()">
              <img
                src="https://community.cloudflare.steamstatic.com/public/images/signinthroughsteam/sits_01.png"
                alt="Sign in through Steam"
              />
            </button>
          }
        </li>
      </ul>
    </div>
  </div>
</nav>
